name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build/publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
            target: ""
            exe: ""
          - os: windows-latest
            artifact: windows-x86_64
            target: ""
            exe: ".exe"
          - os: macos-latest
            artifact: macos-aarch64
            target: ""
            exe: ""
          - os: macos-latest
            artifact: macos-x86_64
            target: x86_64-apple-darwin
            exe: ""
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.artifact }}
      - name: Build release binaries
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --bins --all-features --target "${{ matrix.target }}"
            BIN_DIR="target/${{ matrix.target }}/release"
          else
            cargo build --release --bins --all-features
            BIN_DIR="target/release"
          fi
          mkdir -p dist
          cp "${BIN_DIR}/b2fmsg${{ matrix.exe }}" "dist/b2fmsg-${{ matrix.artifact }}${{ matrix.exe }}"
          cp "${BIN_DIR}/b2fmsg-bridge${{ matrix.exe }}" "dist/b2fmsg-bridge-${{ matrix.artifact }}${{ matrix.exe }}"
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: bins-${{ matrix.artifact }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: bins-*
          merge-multiple: true
      - name: List artifacts
        run: ls -la artifacts
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
          fail_on_unmatched_files: true
